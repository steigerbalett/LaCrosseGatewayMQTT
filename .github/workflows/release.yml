name: Build & Release (ESP8266)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ESP8266 Firmware
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: nodemcuv2
            artifact: LaCrosseGatewayMQTT_NodeMCUv2.bin
          - env: d1_mini
            artifact: LaCrosseGatewayMQTT_D1-Mini.bin
          - env: esp12e
            artifact: LaCrosseGatewayMQTT_ESP8266-generic.bin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch deprecated code for ESP8266 framework 4.x
        run: |
          # Fix 1: espconn.h Include entfernen
          sed -i '/#include.*espconn\.h/d' LaCrosseGateway.ino

          # Fix 1b: espconn Funktionsaufruf entfernen (nicht mehr in lwIP2)
          sed -i '/espconn_tcp_set_max_con/d' LaCrosseGateway.ino

          # Fix 2: SPIFFS → LittleFS
          for f in AddOnSerialBase.cpp Nextion.cpp; do
            sed -i 's/SPIFFS\.openDir/LittleFS.openDir/g' $f
            sed -i 's/SPIFFS\.begin()/LittleFS.begin()/g' $f
            sed -i 's/SPIFFS\.open(/LittleFS.open(/g' $f
            sed -i 's/#include <FS\.h>/#include <LittleFS.h>/g' $f
          done

          # Fix 3: ICACHE_RAM_ATTR → IRAM_ATTR
          sed -i 's/ICACHE_RAM_ATTR/IRAM_ATTR/g' ESP8266SoftSerial.cpp

          # Fix 4: available() → accept()
          sed -i 's/m_server\.available()/m_server.accept()/g' DataPort.cpp

          # Verifikation
          echo "=== Verifikation ==="
          grep -rn "espconn\|ICACHE_RAM_ATTR" . \
            --include="*.ino" --include="*.cpp" --include="*.h" \
            && echo "⚠️ Noch veralteter Code vorhanden!" \
            || echo "✅ Alle Patches erfolgreich"


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-esp8266-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-esp8266-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware [${{ matrix.env }}]
        run: pio run --environment ${{ matrix.env }}

      - name: Rename binary
        run: |
          BIN=".pio/build/${{ matrix.env }}/firmware.bin"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: $BIN not found!"
            find .pio/build/${{ matrix.env }} -type f
            exit 1
          fi
          cp "$BIN" "${{ matrix.artifact }}"
          echo "Binary size: $(du -h ${{ matrix.artifact }})"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -v "^${{ github.ref_name }}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" | head -30)
          else
            LOG=$(git log ${PREV_TAG}..${{ github.ref_name }} \
              --pretty=format:"- %s (%h)")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LaCrosseGatewayMQTT ${{ github.ref_name }}"
          body: |
            ## 🌡️ LaCrosseGatewayMQTT ${{ github.ref_name }}

            ### 📦 Binaries (ESP8266)
            | Datei | Board | Flash |
            |---|---|---|
            | `LaCrosseGatewayMQTT_NodeMCUv2.bin` | NodeMCU v2 (ESP-12E) | 4 MB |
            | `LaCrosseGatewayMQTT_D1-Mini.bin` | Wemos D1 Mini | 4 MB |
            | `LaCrosseGatewayMQTT_ESP8266-generic.bin` | ESP-12E/F generisch | 4 MB |

            ### ⚡ Flash-Befehl (esptool)
            ```bash
            esptool.py --chip esp8266 --baud 921600 \
              write_flash 0x0 LaCrosseGatewayMQTT_NodeMCUv2.bin
            ```

            ### 📝 Änderungen
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: release-assets/*.bin
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
