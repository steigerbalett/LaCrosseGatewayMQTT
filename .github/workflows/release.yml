name: Build & Release (ESP8266)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Version aus .ino extrahieren
        id: extract
        run: |
          VERSION=$(sed -n 's/^#define PROGVERS[[:space:]]*"\([^"]*\)".*/\1/p' LaCrosseGateway.ino)
          echo "Gefundene Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: version.txt aktualisieren
        run: |
          echo "${{ steps.extract.outputs.version }}" > version.txt
          echo "version.txt wurde auf ${{ steps.extract.outputs.version }} gesetzt"

      - name: Prüfen ob version.txt geändert wurde
        id: check_changes
        run: |
          if git diff --quiet version.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Keine Änderung an version.txt nötig"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version.txt hat sich geändert"
          fi

      - name: version.txt committen und pushen
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: version.txt aktualisiert [skip ci]"
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Skipping push: triggered by tag, not a branch"
          fi
          
  build:
    name: Build ESP8266 Firmware
    needs: update-version
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: nodemcuv2
            artifact: LaCrosseGatewayMQTT_NodeMCUv2.bin
          - env: d1_mini
            artifact: LaCrosseGatewayMQTT_D1-Mini.bin
          - env: esp12e
            artifact: LaCrosseGatewayMQTT_ESP8266-generic.bin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch deprecated code for ESP8266 framework 4.x
        run: |
          # Fix 1: espconn.h Include entfernen
          sed -i '/#include.*espconn\.h/d' LaCrosseGateway.ino

          sed -i '/espconn_tcp_set_max_con/d' LaCrosseGateway.ino

          for f in AddOnSerialBase.cpp Nextion.cpp; do
            [ -f "$f" ] && sed -i \
              -e 's/SPIFFS\.openDir/LittleFS.openDir/g' \
              -e 's/SPIFFS\.begin()/LittleFS.begin()/g' \
              -e 's/SPIFFS\.open(/LittleFS.open(/g' \
              -e 's/#include <FS\.h>/#include <LittleFS.h>/g' \
             "$f" && echo "✅ Patched $f" || echo "⚠️ $f nicht gefunden, übersprungen"
          done

          sed -i 's/ICACHE_RAM_ATTR/IRAM_ATTR/g' ESP8266SoftSerial.cpp

          sed -i 's/m_server\.available()/m_server.accept()/g' DataPort.cpp

          echo "=== Verifikation ==="
          grep -rn "espconn\|ICACHE_RAM_ATTR" . \
            --include="*.ino" --include="*.cpp" --include="*.h" \
            && echo "⚠️ Noch veralteter Code vorhanden!" \
            || echo "✅ Alle Patches erfolgreich"


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-esp8266-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-esp8266-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware [${{ matrix.env }}]
        run: pio run --environment ${{ matrix.env }}

      - name: Rename binary
        run: |
          BIN=".pio/build/${{ matrix.env }}/firmware.bin"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: $BIN not found!"
            find .pio/build/${{ matrix.env }} -type f
            exit 1
          fi
          cp "$BIN" "${{ matrix.artifact }}"
          echo "Binary size: $(du -h ${{ matrix.artifact }})"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -v "^${{ github.ref_name }}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" | head -30)
          else
            LOG=$(git log ${PREV_TAG}..${{ github.ref_name }} \
              --pretty=format:"- %s (%h)")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LaCrosseGatewayMQTT ${{ github.ref_name }}"
          body: |
            ## 🌡️ LaCrosseGatewayMQTT ${{ github.ref_name }}

            ### 📦 Binaries (ESP8266)
            | Datei | Board | Flash |
            |---|---|---|
            | `LaCrosseGatewayMQTT_NodeMCUv2.bin` | NodeMCU v2 (ESP-12E) | 4 MB |
            | `LaCrosseGatewayMQTT_D1-Mini.bin` | Wemos D1 Mini | 4 MB |
            | `LaCrosseGatewayMQTT_ESP8266-generic.bin` | ESP-12E/F generisch | 4 MB |

            ### ⚡ Flash-Befehl (per web gui)
            [https://esptool.spacehuhn.com](https://esptool.spacehuhn.com)

            * Öffne [serial.huhn.me](https://esptool.spacehuhn.com) in Chrome oder Edge
            * ESP8266 per USB anschließen
            * Klicke Connect → COM-Port auswählen
            * .bin-Datei hochladen
            * Klicke Program

            ### ⚡ Flash-Befehl (esptool)
            ```bash
            esptool.py --chip esp8266 --baud 921600 \
              write_flash 0x0 LaCrosseGatewayMQTT_NodeMCUv2.bin
            ```
            
            ### 📝 Änderungen
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: release-assets/*.bin
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
