name: Build & Release (ESP8266)

on:
  push:
    branches:
      - dev                    # Dev-Commits → Draft-Release
    tags:
      - 'v*.*.*'               # Tags NUR wenn auf main gepusht (Schutz via Job-Condition)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Version aus .ino extrahieren
        id: extract
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          sed -i "s/#define PROGVERS.*/#define PROGVERS         \"${VERSION}\"/" LaCrosseGateway.ino
          echo "Gefundene Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: version.txt aktualisieren
        run: |
          echo "${{ steps.extract.outputs.version }}" > version.txt
          echo "version.txt wurde auf ${{ steps.extract.outputs.version }} gesetzt"

      - name: Prüfen ob version.txt geändert wurde
        id: check_changes
        run: |
          if git diff --quiet version.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Keine Änderung an version.txt nötig"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version.txt hat sich geändert"
          fi

      - name: version.txt committen und pushen
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: version.txt aktualisiert [skip ci]"
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Skipping push: triggered by tag, not a branch"
          fi

  build:
    name: Build ESP8266 Firmware
    needs: update-version
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: nodemcuv2
            artifact: LaCrosseGatewayMQTT_NodeMCUv2.bin
          - env: d1_mini
            artifact: LaCrosseGatewayMQTT_D1-Mini.bin
          - env: esp12e
            artifact: LaCrosseGatewayMQTT_ESP8266-generic.bin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify – kein veralteter Code mehr im Repository
        run: |
          echo "=== Prüfe auf veraltete APIs ==="
          FOUND=0
          grep -rn "espconn\|ICACHE_RAM_ATTR\|SPIFFS\." \
            --include="*.ino" --include="*.cpp" --include="*.h" . \
            && FOUND=1 || true
          if [ $FOUND -eq 1 ]; then
            echo "❌ Veralteter Code gefunden – bitte direkt im Repository bereinigen!"
            exit 1
          fi
          echo "✅ Alle APIs aktuell – kein sed-Patch nötig"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-esp8266-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-esp8266-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware [${{ matrix.env }}]
        run: pio run --environment ${{ matrix.env }}

      - name: Rename binary
        run: |
          BIN=".pio/build/${{ matrix.env }}/firmware.bin"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: $BIN not found!"
            find .pio/build/${{ matrix.env }} -type f
            exit 1
          fi
          cp "$BIN" "${{ matrix.artifact }}"
          echo "Binary size: $(du -h ${{ matrix.artifact }})"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Draft-Release bei jedem dev-Commit
  # ──────────────────────────────────────────────────────────────────────────
  release-dev:
    name: Create Draft Release (dev)
    needs: build
    runs-on: ubuntu-latest
    # Nur bei Commits auf dev (nicht bei Tags, nicht bei main)
    if: github.ref == 'refs/heads/dev'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version lesen
        id: ver
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag_name=dev-${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Commit-Log seit letztem Tag/Release
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -n1)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" | head -20)
          else
            LOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Altes dev-Draft-Release löschen (falls vorhanden)
        run: |
          # Alle Draft-Releases mit "dev-" im Namen löschen
          RELEASE_IDS=$(gh release list --limit 50 --json tagName,isDraft \
            | jq -r '.[] | select(.isDraft==true and (.tagName | startswith("dev-"))) | .tagName')
          for TAG in $RELEASE_IDS; do
            echo "Lösche altes Draft-Release: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag_name }}
          name: "🚧 Dev Build ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.short_sha }})"
          body: |
            ## 🚧 Entwicklungs-Build (Draft)

            > **Achtung:** Dies ist ein automatischer Build vom `dev`-Branch.
            > Nicht für den Produktiveinsatz empfohlen.

            **Commit:** `${{ github.sha }}`
            **Branch:** `dev`
            **Version:** `${{ steps.ver.outputs.version }}`

            ### 📦 Binaries (ESP8266)
            | Datei | Board |
            |---|---|
            | `LaCrosseGatewayMQTT_NodeMCUv2.bin` | NodeMCU v2 (ESP-12E) |
            | `LaCrosseGatewayMQTT_D1-Mini.bin` | Wemos D1 Mini |
            | `LaCrosseGatewayMQTT_ESP8266-generic.bin` | ESP-12E/F generisch |

            ### 📝 Änderungen seit letztem Release
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: release-assets/*.bin
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Finales Release nur bei Tags AUF main
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release (main tag)
    needs: build
    runs-on: ubuntu-latest
    # Tag-Push UND der Commit, auf den der Tag zeigt, muss auf main liegen
    if: startsWith(github.ref, 'refs/tags/v') && github.event.base_ref == 'refs/heads/main'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -v "^${{ github.ref_name }}$" \
            | grep -v "^dev-" \
            | head -n1)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" | head -30)
          else
            LOG=$(git log ${PREV_TAG}..${{ github.ref_name }} \
              --pretty=format:"- %s (%h)")
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LaCrosseGatewayMQTT ${{ github.ref_name }}"
          body: |
            ## 🌡️ LaCrosseGatewayMQTT ${{ github.ref_name }}

            ### 📦 Binaries (ESP8266)
            | Datei | Board | Flash |
            |---|---|---|
            | `LaCrosseGatewayMQTT_NodeMCUv2.bin` | NodeMCU v2 (ESP-12E) | 4 MB |
            | `LaCrosseGatewayMQTT_D1-Mini.bin` | Wemos D1 Mini | 4 MB |
            | `LaCrosseGatewayMQTT_ESP8266-generic.bin` | ESP-12E/F generisch | 4 MB |

            ### ⚡ Flash-Befehl (per web gui)
            [https://esptool.spacehuhn.com](https://esptool.spacehuhn.com)

            * Öffne [esptool.huhn.com](https://esptool.spacehuhn.com) in Chrome oder Edge
            * ESP8266 per USB anschließen
            * Klicke Connect → COM-Port auswählen
            * .bin-Datei hochladen
            * Klicke Program

            ### ⚡ Flash-Befehl (esptool)
            ```bash
            esptool.py --chip esp8266 --baud 921600 \
              write_flash 0x0 LaCrosseGatewayMQTT_NodeMCUv2.bin
            ```

            ### 📝 Änderungen
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: release-assets/*.bin
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}